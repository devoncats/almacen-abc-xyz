[project]
name = "almacen"
version = "0.1.0"
description = "Rule-based expert system for ABC/XYZ warehouse replenishment policies"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tabulate>=0.9",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
almacen = "almacen.cli:app"

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0.261029",
    "pyright>=1.1.414",
    "pytest>=8.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/almacen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
